name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      # The macos-14 image's *default* Xcode is 15.x, whose Swift predates
      # language mode 6 and rejects Package.swift's `-swift-version 6`
      # (`error: invalid value '6'`). Select the newest Xcode 16.x on the image
      # to get a Swift-6-capable toolchain before building.
      - name: Select Swift 6 toolchain (Xcode 16+)
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 16.x found on this runner. Available Xcodes:"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          swift --version

      - name: Build macOS App
        run: |
          cd menubar-app/ClaudeMonitor
          swift build

      - name: Self-test (portable core)
        run: |
          cd menubar-app/ClaudeMonitor
          .build/debug/ClaudeMonitor selftest

  build-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5

      - name: Install SQLite dev headers
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Build (Linux headless)
        run: |
          cd menubar-app/ClaudeMonitor
          swift build

      - name: Self-test (portable core)
        run: |
          cd menubar-app/ClaudeMonitor
          .build/debug/ClaudeMonitor selftest

      - name: Smoke run (no credentials)
        run: |
          cd menubar-app/ClaudeMonitor
          .build/debug/ClaudeMonitor --once
          # The binary resolves home via homeDirectoryForCurrentUser (passwd
          # entry), while Actions containers set HOME elsewhere — check both.
          passwd_home=$(getent passwd "$(id -u)" | cut -d: -f6)
          test -f "$passwd_home/.claude-monitor/usage.db" || test -f "$HOME/.claude-monitor/usage.db"
