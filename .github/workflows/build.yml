name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Fires when `/repo:release` (or a manual `gh release create`) publishes a
  # GitHub Release — used below to attach the static Linux binary as a
  # release asset. Does NOT fire for draft releases, only `published`.
  release:
    types: [published]
  # Manual fallback: `pull_request`/`push` webhook deliveries can silently
  # stop firing (see issue #66) without any change to this file or the repo's
  # Actions settings. `workflow_dispatch` lets a run be queued directly
  # against any branch/PR head, independent of webhook delivery, via
  # `gh workflow run build.yml --ref <branch>` or the Actions UI "Run
  # workflow" button. No inputs needed.
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      # The macos-14 image's *default* Xcode is 15.x, whose Swift predates
      # language mode 6 and rejects Package.swift's `-swift-version 6`
      # (`error: invalid value '6'`). Select the newest Xcode 16.x on the image
      # to get a Swift-6-capable toolchain before building.
      - name: Select Swift 6 toolchain (Xcode 16+)
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE" ]; then
            echo "No Xcode 16.x found on this runner. Available Xcodes:"
            ls -d /Applications/Xcode_*.app || true
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          swift --version

      - name: Build macOS App
        run: |
          cd menubar-app/LLMMonitor
          swift build

      - name: Self-test (portable core)
        run: |
          cd menubar-app/LLMMonitor
          .build/debug/LLMMonitor selftest

  build-linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v7

      - name: Install SQLite dev headers
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Build (Linux headless)
        run: |
          cd menubar-app/LLMMonitor
          swift build

      - name: Self-test (portable core)
        run: |
          cd menubar-app/LLMMonitor
          .build/debug/LLMMonitor selftest

      - name: Smoke run (no credentials)
        run: |
          cd menubar-app/LLMMonitor
          .build/debug/LLMMonitor --once
          # The binary resolves home via homeDirectoryForCurrentUser (passwd
          # entry), while Actions containers set HOME elsewhere — check both.
          passwd_home=$(getent passwd "$(id -u)" | cut -d: -f6)
          for h in "$passwd_home" "$HOME"; do
            if test -f "$h/.llm-monitor/usage.db"; then
              # The pre-2.0 name must stay a symlink to the new directory (loom-daemon reads it).
              test "$(readlink "$h/.claude-monitor")" = ".llm-monitor" && found=1 && break
            fi
          done
          test -n "${found:-}"

      # A plain `swift build` output is dynamically linked against the Swift
      # runtime, which is not installed on a bare Linux host — see #185. A
      # release build with `--static-swift-stdlib` links the Swift/Foundation
      # runtime statically so the binary runs with no toolchain on the host.
      - name: Build static release binary (Linux headless)
        run: |
          cd menubar-app/LLMMonitor
          swift build -c release --static-swift-stdlib

      - name: Verify no dynamic Swift/Foundation/dispatch dependency
        run: |
          cd menubar-app/LLMMonitor
          BIN=.build/release/LLMMonitor
          echo "ldd output:"
          ldd "$BIN"
          if ldd "$BIN" | grep -qiE 'libswift|libfoundation|libdispatch'; then
            echo "::error::Static release binary still depends on a dynamic Swift/Foundation/dispatch library:"
            ldd "$BIN" | grep -iE 'libswift|libfoundation|libdispatch'
            exit 1
          fi

      - name: Self-test (static release binary)
        run: |
          cd menubar-app/LLMMonitor
          .build/release/LLMMonitor selftest

      - name: Smoke run (static release binary, no credentials)
        run: |
          cd menubar-app/LLMMonitor
          rm -rf "$HOME/.claude-monitor" "$HOME/.llm-monitor"
          .build/release/LLMMonitor --once
          passwd_home=$(getent passwd "$(id -u)" | cut -d: -f6)
          for h in "$passwd_home" "$HOME"; do
            if test -f "$h/.llm-monitor/usage.db"; then
              # The pre-2.0 name must stay a symlink to the new directory (loom-daemon reads it).
              test "$(readlink "$h/.claude-monitor")" = ".llm-monitor" && found=1 && break
            fi
          done
          test -n "${found:-}"

      - name: Stage static release binary
        run: |
          mkdir -p dist
          cp menubar-app/LLMMonitor/.build/release/LLMMonitor dist/llm-monitor-linux-x64
          # Pre-2.0 asset name, still attached so a 1.x install-linux.sh
          # --from-release keeps working. Remove with the ~/.claude-monitor symlink.
          cp dist/llm-monitor-linux-x64 dist/claude-monitor-linux-x64
          chmod 755 dist/llm-monitor-linux-x64 dist/claude-monitor-linux-x64

      - name: Upload static release binary as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-monitor-linux-x64
          path: |
            dist/llm-monitor-linux-x64
            dist/claude-monitor-linux-x64
          if-no-files-found: error

  # Attaches the static Linux binary built by build-linux to the GitHub
  # Release that just triggered this run. Only fires on `release: published`
  # — every push/PR run still builds and verifies the same binary above via
  # build-linux, it just doesn't get uploaded anywhere.
  publish-linux-release-asset:
    name: Attach llm-monitor-linux-x64 to GitHub Release
    needs: build-linux
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download static Linux binary artifact
        uses: actions/download-artifact@v4
        with:
          name: llm-monitor-linux-x64
          path: dist

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod 755 dist/llm-monitor-linux-x64 dist/claude-monitor-linux-x64
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/llm-monitor-linux-x64 dist/claude-monitor-linux-x64 \
            --repo "${{ github.repository }}" \
            --clobber
